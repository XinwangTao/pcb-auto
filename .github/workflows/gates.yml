name: gates

# README 与 AGENTS.md 都写着「24 道闸门」，而 smoke.yml 只跑其中 7 道。
# 这个 workflow 把 `npm test` 整套跑一遍 —— **公开主张必须由 CI 验证**，
# 否则「24 道」只是一个可以随便写的数字。
#
# 为什么只在 windows：其中 7 道闸门要 pwsh 7（run-all.ps1 的退出码三态、
# 控制台编码、runall-fabcheck 的嵌入执行、rundir、以及两个 powershell 侧的自检），
# 而本项目的流水线本身也只支持 Windows。跨平台的接入层由 smoke.yml 在 ubuntu 上覆盖 ——
# 两个 job 加起来才是完整主张。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-chain:
    name: 24 道闸门 · windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 与 smoke.yml 相反：**这里必须 npm install**。
      # `scripts/staticcheck.js`（契约闸门）需要 acorn + eslint-scope 真正解析
      # `scripts/*.js` 的 invoke 函数体；缺了它只报「解析器不可用，本关跳过」，
      # 也就是**契约闸门静默关闭而没有任何一处会红**。
      # 这两个包已声明为 devDependencies；运行时仍然零依赖。
      - name: 装测试依赖（acorn / eslint-scope）
        run: npm install --no-audit --no-fund

      - name: 确认契约闸门没有静默跳过
        shell: pwsh
        run: |
          $out = node scripts/staticcheck.js scripts/pipeline3.js 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "staticcheck exit=$LASTEXITCODE（契约闸门跑不起来，等于关闭）" }
          if ($out -match '解析器不可用') { throw "解析器仍不可用 —— npm install 没生效" }

      # 【doctor 在 CI 上应当报「没有 EDA」——那不是故障，是 CI 的应然状态】
      # 所以不能直接 `npm run doctor`（它会正确地 exit 1），也不能
      # `continue-on-error`（那是把闸门关了）。正确做法：**断言它只因这一条而阻塞**。
      # 这样 doctor 自身的回归（比如它开始报别的阻塞项）仍然会被抓到。
      - name: doctor 在无 EDA 的 CI 上应只报 EDA 一条阻塞
        shell: pwsh
        run: |
          $out = node scripts/preflight.mjs 2>&1 | Out-String
          Write-Host $out
          $code = $LASTEXITCODE
          if ($code -ne 1) { throw "doctor exit=$code，期望 1（CI 上应因无 EDA 而阻塞）" }
          # 【别把断言锁在一个只在成功时才出现的词上】实测 2026-11-27（CI 第一次跑）：
          # 我写的是 `-notmatch 'LCEDA'`，而 doctor 失败时打的是解析器的原话
          # 「找不到 嘉立创 EDA Pro 的 CLI（lceda-pro）」—— **没有 LCEDA 这个词**。
          # 于是阻塞原因明明对，断言却报「没指出」。
          if ($out -notmatch 'EDA Pro|lceda-pro') { throw "doctor 没有指出 EDA —— 阻塞原因不对" }
          if ($out -notmatch '1 个阻塞项') {
            throw "doctor 报了不止一个阻塞项 —— 说明 CI 环境里还有别的硬缺失，先看上面的输出"
          }
          Write-Host 'OK：doctor 只因「没有 EDA」一条阻塞，与 CI 的应然状态一致'
          # 【必须显式 exit 0】实测 2026-11-27（CI 第三次跑）：上面所有断言都过了、
          # 也打了 OK，但步骤仍然失败 —— 因为 `shell: pwsh` 的步骤退出码取的是
          # `$LASTEXITCODE`，而它停在了 `node scripts/preflight.mjs` 的 **1**。
          # 这是 PowerShell + CI 的经典坑：判辊走完了，退出码却还是上一条命令的。
          # 用 `$LASTEXITCODE = 0` 不够不够直白：直接 `exit 0`，让意图不可误读。
          exit 0

      - name: 整套闸门
        shell: pwsh
        run: npm test

      - name: 闸门数量必须与 README 声称的一致
        shell: pwsh
        run: |
          $n = (Get-Content package.json -Raw | ConvertFrom-Json).scripts.test.Split('&&').Count
          Write-Host "package.json 里的闸门数 = $n"
          if ($n -lt 20) { throw "闸门数只有 $n，README 声称 24 道 —— 主张与实现不一致" }
